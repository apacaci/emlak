name: Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'web/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk ilanyaz-deneme-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ilanyaz-deneme-apk
          path: ilanyaz-deneme-${{ github.run_number }}.apk

      - name: Publish as release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "deneme-${{ github.run_number }}" \
            "ilanyaz-deneme-${{ github.run_number }}.apk" \
            --title "Deneme sürümü ${{ github.run_number }}" \
            --notes "Deneme APK'sı. Telefonda bu dosyayı indirip kurabilirsin. Metinler şablondan üretilir, ödeme çalışmaz."
